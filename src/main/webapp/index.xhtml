<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>RANG Saúde</title>
</h:head>

<h:body>

    <h1>RANG Saúde</h1>

    <h2>Consulta de Unidade de Saúde</h2>

    <h:form>

        <p:outputLabel value="Digite o CEP:" />

        <br />

        <p:inputText value="#{consultaBean.cep}" />

        <br /><br />

        <p:commandButton value="Consultar"
                 action="#{consultaBean.consultar}"
                 update="@form"
                 ajax="false" />

        <br /><br />

        <p:outputPanel rendered="#{consultaBean.unidade != null}">

            <h3>Unidade encontrada:</h3>

            <p>Nome: #{consultaBean.unidade.nomeEstabelecimento}</p>

            <p>CNES: #{consultaBean.unidade.cnes}</p>

        </p:outputPanel>

    </h:form>

</h:body>

</html>
